<section #feed class="feed" aria-label="Сообщения">
  @if (loading() && !messages().length) {
    <p class="state">Загрузка…</p>
  } @else if (loadError(); as error) {
    <p class="state error" role="alert">{{ error }}</p>
  } @else if (!messages().length) {
    <p class="state">Сообщений пока нет</p>
  } @else {
    <ol class="list" [attr.aria-label]="'Сообщения чата ' + chatName()">
      @for (message of messages(); track message.id) {
        <li>
          <app-message-item [message]="message" (changed)="onMessageChanged()" (deleted)="onMessageDeleted()" />
        </li>
      }
    </ol>
  }
</section>

<form class="composer" (submit)="send($event)">
  @if (sendError(); as error) {
    <p class="send-error" role="alert">{{ error }}</p>
  }
  <div class="composer-box">
    <textarea
      name="message"
      rows="1"
      placeholder="Напишите сообщение…"
      [attr.aria-label]="'Сообщение в чат ' + chatName()"
      [value]="draft()"
      [readOnly]="sending()"
      (input)="onDraftInput($event)"
      (keydown)="onComposerKeydown($event)"
    ></textarea>
    <button type="submit" class="primary send" aria-label="Отправить" title="Отправить (Enter)" [disabled]="!canSend()">↑</button>
  </div>
</form>
