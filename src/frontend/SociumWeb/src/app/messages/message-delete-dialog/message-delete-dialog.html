<div class="backdrop" (click)="close()"></div>
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="message-delete-title">
  <h2 id="message-delete-title">Удалить сообщение?</h2>

  @if (loading()) {
    <p>Загрузка…</p>
  } @else if (message()) {
    <blockquote class="preview"><span class="preview-text">{{ preview() }}</span></blockquote>
    <p>Сообщение будет удалено без возможности восстановления.</p>
  }

  @if (error(); as text) {
    <p class="error" role="alert">{{ text }}</p>
  }

  <div class="buttons">
    <button #cancelButton type="button" (click)="close()" [disabled]="deleting()">Отмена</button>
    <button type="button" class="danger" (click)="confirm()" [disabled]="!message() || deleting()">Удалить</button>
  </div>
</div>
