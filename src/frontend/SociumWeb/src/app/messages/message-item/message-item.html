@if (editing()) {
  <form class="edit-form" (submit)="save($event)">
    <textarea
      #editInput
      name="text"
      rows="1"
      aria-label="Новый текст сообщения"
      [value]="draftText()"
      [readOnly]="saving()"
      (input)="onDraftInput($event)"
      (keydown)="onEditKeydown($event)"
      (keydown.escape)="cancelEdit()"
    ></textarea>
    <div class="edit-buttons">
      <button type="button" (click)="cancelEdit()" [disabled]="saving()">Отмена</button>
      <button type="submit" class="primary" [disabled]="saving() || !draftText().trim()">Сохранить</button>
    </div>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  </form>
} @else {
  <div class="row" [class.own]="own()">
    <div class="bubble">
      <p class="sender">{{ message().senderName }}</p>
      <p class="text">{{ message().text }}</p>
      <time class="time" [attr.datetime]="message().createdAt" [title]="fullTime()">{{ time() }}</time>
    </div>
    @if (own() && !confirmingDelete()) {
      <div class="actions">
        <button type="button" class="icon" title="Изменить" aria-label="Изменить сообщение" (click)="startEdit()">
          <app-icon name="pencil" />
        </button>
        <button type="button" class="icon danger" title="Удалить" aria-label="Удалить сообщение" (click)="requestDelete()">
          <app-icon name="trash" />
        </button>
      </div>
    }
  </div>
  @if (confirmingDelete()) {
    <app-message-delete-confirm [messageId]="message().id" (deleted)="deleted.emit()" (cancelled)="confirmingDelete.set(false)" />
  }
}
