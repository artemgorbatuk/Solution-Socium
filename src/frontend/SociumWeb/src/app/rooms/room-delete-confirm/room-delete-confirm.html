<p>Удалить комнату «<strong>{{ roomName() }}</strong>»?</p>
@if (room()?.chatCount; as chatCount) {
  <p class="warning">Вместе с комнатой будут удалены чаты: {{ chatCount }}</p>
}

@if (error(); as message) {
  <p class="error" role="alert">{{ message }}</p>
}

<div class="buttons">
  <button #cancelButton type="button" (click)="cancel()" [disabled]="deleting()">Отмена</button>
  <button type="button" class="danger" (click)="confirm()" [disabled]="!room() || deleting()">Удалить</button>
</div>
