<div class="corner">
  <app-theme-toggle />
</div>

<form class="card" aria-label="Новый пароль" (submit)="submit($event)">
  <h1 class="brand">Socium</h1>
  <h2 class="title">Новый пароль</h2>

  @if (!token().trim()) {
    <p class="error" role="alert">Ссылка сброса недействительна</p>
    <p class="switch">
      <a class="link" routerLink="/forgot-password">Запросить новую ссылку</a>
    </p>
  } @else {
    <label class="field">
      <span>Пароль</span>
      <input
        type="password"
        name="password"
        autocomplete="new-password"
        [attr.maxlength]="passwordMaxLength"
        [value]="password()"
        [disabled]="saving()"
        (input)="onPasswordInput($event)"
      />
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button type="submit" class="primary submit" [disabled]="!canSubmit()">Сохранить пароль</button>

    <p class="switch">
      <a class="link" routerLink="/login">На экран входа</a>
    </p>
  }
</form>
