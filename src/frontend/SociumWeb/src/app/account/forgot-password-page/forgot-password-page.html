<div class="corner">
  <app-theme-toggle />
</div>

<form class="card" aria-label="Сброс пароля" (submit)="submit($event)">
  <h1 class="brand">Socium</h1>
  <h2 class="title">Сброс пароля</h2>
  <p class="hint">Укажите email — пришлём ссылку для нового пароля.</p>

  <label class="field">
    <span>Email</span>
    <input
      type="email"
      name="email"
      autocomplete="email"
      [attr.maxlength]="emailMaxLength"
      [value]="email()"
      [disabled]="saving()"
      (input)="onEmailInput($event)"
    />
  </label>

  @if (success(); as message) {
    <p class="success" role="status">{{ message }}</p>
  }

  @if (error(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  <button type="submit" class="primary submit" [disabled]="!canSubmit()">Отправить ссылку</button>

  <p class="switch">
    <a class="link" routerLink="/login">Назад ко входу</a>
  </p>
</form>
