@if (editing()) {
  <form class="rename-form" (submit)="save($event)">
    <input
      #nameInput
      type="text"
      name="name"
      aria-label="Новое название чата"
      [attr.maxlength]="nameMaxLength"
      [value]="draftName()"
      [disabled]="saving()"
      (input)="onDraftInput($event)"
      (keydown.escape)="cancelRename()"
    />
    <div class="rename-buttons">
      <button type="button" (click)="cancelRename()" [disabled]="saving()">Отмена</button>
      <button type="submit" class="primary" [disabled]="saving() || !draftName().trim()">Сохранить</button>
    </div>
    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }
  </form>
} @else if (confirmingDelete()) {
  <app-chat-delete-confirm [chatId]="chat().id" [chatName]="chat().name" (deleted)="deleted.emit()" (cancelled)="confirmingDelete.set(false)" />
} @else {
  <div class="row">
    <a
      class="chat-link"
      [routerLink]="['/chat', chat().id]"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [title]="chat().name"
    >
      <span class="chat-icon" aria-hidden="true">#</span>
      <span class="chat-name">{{ chat().name }}</span>
    </a>
    @if (chat().isAdmin) {
      <div class="actions">
        <button
          type="button"
          class="icon"
          title="Переименовать"
          [attr.aria-label]="'Переименовать чат ' + chat().name"
          (click)="startRename()"
        >
          <app-icon name="pencil" />
        </button>
        <button
          type="button"
          class="icon danger"
          title="Удалить"
          [attr.aria-label]="'Удалить чат ' + chat().name"
          (click)="requestDelete()"
        >
          <app-icon name="trash" />
        </button>
      </div>
    }
  </div>
}
