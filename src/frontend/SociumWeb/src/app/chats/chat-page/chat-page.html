@if (chat(); as chat) {
  <app-chat-messages [chatId]="chat.id" [chatName]="chat.name" />
} @else if (loading()) {
  <p class="state">Загрузка…</p>
} @else if (notFound()) {
  <div class="state">
    <p>Чат не найден</p>
    <a routerLink="/">На главную</a>
  </div>
} @else if (loadError(); as error) {
  <p class="state error" role="alert">{{ error }}</p>
}
