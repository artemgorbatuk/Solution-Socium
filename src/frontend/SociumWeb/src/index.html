<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Socium</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Applies the saved theme before Angular starts to avoid a light flash; keep in sync with app/shared/theme/theme.ts.
    try {
      document.documentElement.dataset.theme = localStorage.getItem('socium.theme') === 'dark' ? 'dark' : 'light';
    } catch {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
