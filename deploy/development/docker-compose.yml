# Локальная разработка (Windows): инфраструктура для WebApi, запущенного вне Docker.
# Запуск из корня репозитория:
#   docker compose -f deploy/development/docker-compose.yml up -d
# Имена: socium-dev-* / socium-volume-dev-* / socium-network-dev.

name: socium-dev

networks:
  socium-network-dev:
    name: socium-network-dev
    driver: bridge

volumes:
  socium-volume-dev-postgres-data:
    name: socium-volume-dev-postgres-data

services:
  postgres:
    image: postgres:18
    container_name: socium-dev-postgres
    networks:
      - socium-network-dev
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "Socium"
    # 5432 на хосте может быть занят другими проектами
    ports:
      - "5433:5432"
    volumes:
      - socium-volume-dev-postgres-data:/var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Socium"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP-ловушка: письма не уходят в интернет (UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:latest
    container_name: socium-dev-mailpit
    networks:
      - socium-network-dev
    environment:
      # На Docker Desktop (Windows) reverse DNS клиента часто таймаутится и тормозит SMTP.
      MP_SMTP_DISABLE_RDNS: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
